<style>
:root{--bg:#f3f6f4;--fg:#15201b;--muted:#5a6861;--line:#d8e0dc;--surface:#fff;--accent:#0f6b4f;--on:#fff;--err:#b84a3d}
@media (prefers-color-scheme:dark){:root{--bg:#111714;--fg:#e6ece8;--muted:#9aa8a0;--line:#2a3530;--surface:#19211d;--accent:#5cc79f;--on:#0d1512;--err:#ec8a7d;color-scheme:dark}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px;box-sizing:border-box}
form{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px;width:100%;max-width:340px;display:grid;gap:12px}
h1{font-size:19px;margin:0}
input[type=password]{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
button{font:inherit;font-weight:600;padding:9px;border-radius:6px;border:0;background:var(--accent);color:var(--on);cursor:pointer}
label.r{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--muted)}
#msg{font-size:13.5px;color:var(--err);min-height:1.2em;margin:0}
</style></head><body>
