<style>
:root{--bg:#f3f6f4;--fg:#15201b;--muted:#5a6861;--line:#d8e0dc;--surface:#fff;--accent:#0f6b4f;--on:#fff;--err:#b84a3d}

h1{font-size:19px;margin:0}
input[type=password]{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}

label.r{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--muted)}
#msg{font-size:13.5px;color:var(--err);min-height:1.2em;margin:0}
</style></head><body>
